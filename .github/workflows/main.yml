name: Build quickfile 

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - x86_64
        sdk:
          - "24.10"

    steps:
      - uses: actions/checkout@v4

      # 🔧 在 SDK 容器外部安装 shfmt 以修复 check 步骤的失败
      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      # 🔧 手动将仓库目录结构调整为 OpenWrt Feed 格式
      - name: Prepare feed structure
        run: |
          mkdir -p openwrt-feed/quickfile
          mkdir -p openwrt-feed/luci-app-quickfile
          cp -r quickfile/* openwrt-feed/quickfile/
          cp -r luci-app-quickfile/* openwrt-feed/luci-app-quickfile/

      # 🔧 使用修复后的 gh-action-sdk 配置（环境变量在全局 env 中定义）
      - name: Build packages with SDK
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: quickfile
          PACKAGES: quickfile luci-app-quickfile luci-i18n-quickfile-zh-cn
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true
          INDEX: 1
          V: s

      - name: Collect packages
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/release dist/feed

          # IPK：release 加安全文件名，feed 保留原名
          for f in bin/packages/${ARCH}/quickfile/*.ipk; do
            [ -f "$f" ] || continue
            [[ "$(basename $f)" == Packages* ]] && continue
            base=$(basename "$f" .ipk)
            safe="${base//\~/.}"
            cp -v "$f" "dist/release/${safe}.ipk"
            cp -v "$f" dist/feed/
          done

          # APK：release 加架构后缀，feed 保留原名
          for f in bin/packages/${ARCH}/quickfile/*.apk; do
            [ -f "$f" ] || continue
            [[ "$(basename $f)" == Packages* ]] && continue
            base=$(basename "$f" .apk)
            safe="${base//\~/.}"
            cp -v "$f" "dist/release/${safe}-${ARCH}.apk"
            cp -v "$f" "dist/feed/${safe}.apk"
          done

          # Feed 索引（仅 feed）
          for f in bin/packages/${ARCH}/quickfile/Packages* bin/packages/${ARCH}/quickfile/APKINDEX*; do
            [ -f "$f" ] || continue
            cp -v "$f" dist/feed/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: packages-*

      - name: Flatten release files
        run: |
          mkdir -p dist
          find all-artifacts -path "*/release/*" -type f -exec cp -v {} dist/ \;

      - name: Determine tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          ARCHS="aarch64_cortex-a53 aarch64_generic x86_64"

          {
            echo "## 📦 SDK 24.10 · (IPK)"
            echo ""
            echo "| 架构 | quickfile | luci-app-quickfile | luci-i18n-quickfile-zh-cn |"
            echo "| :--- | :--- | :--- | :--- |"
            for arch in $ARCHS; do
              f_core=$(ls dist/quickfile_*_${arch}.ipk 2>/dev/null | head -1)
              f_luci=$(ls dist/luci-app-quickfile_*_all.ipk 2>/dev/null | head -1)
              f_i18n=$(ls dist/luci-i18n-quickfile-zh-cn_*_all.ipk 2>/dev/null | head -1)
              link_core=$( [ -n "$f_core" ] && echo "[$(basename $f_core)](${BASE}/$(basename $f_core))" || echo "—" )
              link_luci=$( [ -n "$f_luci" ] && echo "[$(basename $f_luci)](${BASE}/$(basename $f_luci))" || echo "—" )
              link_i18n=$( [ -n "$f_i18n" ] && echo "[$(basename $f_i18n)](${BASE}/$(basename $f_i18n))" || echo "—" )
              echo "| \`${arch}\` | ${link_core} | ${link_luci} | ${link_i18n} |"
            done
          } > release_notes.md

          cat release_notes.md

      - name: Replace Existing Manual Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
