
name: Build luci-app-quickfile IPK

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本 (例如: 24.10.0, 23.05.5)'
        required: true
        default: '24.10.0'
      target_arch:
        description: '目标架构路径 (例如: x86/64, x86_64, ramips/mt7621)'
        required: true
        default: 'x86/64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert architecture name (replace '/' with '_')
        id: arch_conv
        run: |
          RAW_ARCH="${{ github.event.inputs.target_arch }}"
          SAFE_ARCH=$(echo "$RAW_ARCH" | tr '/' '_')
          echo "safe_arch=${SAFE_ARCH}" >> $GITHUB_OUTPUT
          echo "Input architecture: ${RAW_ARCH} -> Converted: ${SAFE_ARCH}"

      - name: Build packages with SDK
        uses: openwrt/gh-action-sdk@main
        env:
          OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version }}
          ARCH: ${{ steps.arch_conv.outputs.safe_arch }}
          FEEDNAME: quickfile
          PACKAGES: quickfile luci-app-quickfile luci-i18n-quickfile-zh-cn

      - name: Collect built packages
        id: collect
        run: |
          mkdir -p ipk
          # 查找所有生成的 .ipk 文件
          find bin -name "*.ipk" -exec cp -v {} ipk/ \;
          echo "Files collected:"
          ls -la ipk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickfile-${{ github.event.inputs.openwrt_version }}-${{ steps.arch_conv.outputs.safe_arch }}
          path: ipk/
